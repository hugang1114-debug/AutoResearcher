[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearcher"
version = "1.0.0"
description = "Research-paper discovery and evidence-based paper analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AutoResearcher Contributors" }]
dependencies = ["pydantic>=2.0", "pypdf>=4.0"]

[project.scripts]
autoresearcher = "autoresearcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
